{{- /*
  Alerts + recording rules. Keep in sync with deploy/grafana/alert-rules.yml (compose).
  Prometheus template expressions are escaped with raw-string literals so Helm does not evaluate them.
*/ -}}
{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $t := .Values.monitoring.prometheusRule.thresholds }}
{{- $mt := .Values.monitoring.prometheusRule.metrics }}
{{- $ns := .Release.Namespace }}
{{- $fn := include "slm.fullname" . }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fn }}
  labels:
    {{- include "slm.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: slm-studio.recording
      interval: 30s
      rules:
        # Per-pod request rate: exposed to the HPA as `slm_http_requests_per_second` through prometheus-adapter.
        - record: slm:http_requests_per_second:rate2m
          expr: sum by (namespace, pod, service) (rate({{ $mt.httpRequestsTotal }}[2m]))
        - record: slm:gateway_error_ratio:rate5m
          expr: |
            sum(rate({{ $mt.httpRequestsTotal }}{service="gateway",status=~"5.."}[5m]))
            / clamp_min(sum(rate({{ $mt.httpRequestsTotal }}{service="gateway"}[5m])), 1e-9)

    - name: slm-studio.alerts
      rules:
        - alert: SLMHighErrorRate
          expr: |
            slm:gateway_error_ratio:rate5m > {{ $t.errorRatio }}
            and sum(rate({{ $mt.httpRequestsTotal }}{service="gateway"}[5m])) > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Gateway 5xx ratio above {{ mulf $t.errorRatio 100 }}% for 5 minutes"
            description: {{`"{{ $value | humanizePercentage }} of gateway requests are failing."`}}

        - alert: SLMGatewayLatencyP95High
          expr: |
            histogram_quantile(0.95, sum by (le) (rate({{ $mt.httpRequestDuration }}_bucket{service="gateway"}[5m]))) > {{ $t.gatewayP95Seconds }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Gateway p95 latency above {{ $t.gatewayP95Seconds }}s"
            description: {{`"p95 end-to-end gateway latency is {{ $value | humanizeDuration }}."`}}

        - alert: SLMvLLMTimeToFirstTokenHigh
          expr: |
            histogram_quantile(0.95, sum by (le, slm_deployment) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > {{ $t.ttftP95Seconds }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: {{`"p95 time-to-first-token high on {{ $labels.slm_deployment }}"`}}
            description: "Queueing or prefill saturation (threshold {{ $t.ttftP95Seconds }}s). Check waiting requests and KV cache usage."

        - alert: SLMvLLMQueueBacklog
          expr: sum by (slm_deployment) (vllm:num_requests_waiting) > {{ $t.queueWaiting }}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: {{`"{{ $labels.slm_deployment }} has {{ $value }} waiting requests"`}}
            description: "Scale replicas (KEDA) or raise max_num_seqs."

        - alert: SLMvLLMKVCacheSaturated
          expr: max by (slm_deployment) (vllm:gpu_cache_usage_perc or vllm:kv_cache_usage_perc) > {{ $t.kvCacheRatio }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: {{`"KV cache above threshold on {{ $labels.slm_deployment }}"`}}
            description: "Requests will be preempted; reduce max_model_len/max_num_seqs or add capacity."

        - alert: SLMGPUUtilizationSaturated
          expr: avg by (Hostname, gpu) (avg_over_time(DCGM_FI_DEV_GPU_UTIL[15m])) > {{ $t.gpuUtilizationPercent }}
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: {{`"GPU {{ $labels.gpu }} on {{ $labels.Hostname }} saturated"`}}
            description: "15 minute average GPU utilisation is above {{ $t.gpuUtilizationPercent }}%."

        - alert: SLMGPUMemoryHigh
          expr: |
            100 * DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > {{ $t.gpuMemoryPercent }}
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: {{`"GPU {{ $labels.gpu }} memory above threshold on {{ $labels.Hostname }}"`}}
            description: "Risk of OOM; lower gpu_memory_utilization or move a model."

        - alert: SLMDeploymentUnhealthy
          expr: |
            kube_deployment_status_replicas_available{namespace="{{ $ns }}",deployment=~"{{ $fn }}-.*"}
              < kube_deployment_spec_replicas{namespace="{{ $ns }}",deployment=~"{{ $fn }}-.*"}
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: {{`"Deployment {{ $labels.deployment }} has unavailable replicas"`}}
            description: "Available replicas have been below the desired count for 10 minutes."

        - alert: SLMModelServerUnhealthy
          expr: |
            kube_statefulset_status_replicas_ready{namespace="{{ $ns }}",statefulset=~"{{ $fn }}-vllm-.*"}
              < kube_statefulset_replicas{namespace="{{ $ns }}",statefulset=~"{{ $fn }}-vllm-.*"}
          for: 15m
          labels: { severity: critical }
          annotations:
            summary: {{`"vLLM server {{ $labels.statefulset }} has replicas not ready"`}}
            description: "Model servers have been below the desired ready count for 15 minutes (loading weights, OOM, or no GPU capacity)."

        - alert: SLMPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="{{ $ns }}",pod=~"{{ $fn }}-.*"}[15m]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: {{`"Pod {{ $labels.pod }} is restarting repeatedly"`}}
            description: "More than 3 container restarts in 15 minutes."

        - alert: SLMTargetDown
          expr: up{namespace="{{ $ns }}",slm_service!=""} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: {{`"{{ $labels.slm_service }} target is down"`}}
            description: {{`"Prometheus cannot scrape {{ $labels.pod }}."`}}
{{- end }}
