{{- /* HorizontalPodAutoscaler for every service with autoscaling.enabled (gateway by default): CPU + optional per-pod RPS. */ -}}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
{{- $as := default (dict) $cfg.autoscaling }}
{{- if $as.enabled }}
{{- $tier := default "control-plane" $cfg.tier }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "slm.fullname" $ }}-{{ $name }}
  labels:
    {{- include "slm.componentLabels" (dict "root" $ "component" $name "tier" $tier) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "slm.fullname" $ }}-{{ $name }}
  minReplicas: {{ $as.minReplicas | int }}
  maxReplicas: {{ $as.maxReplicas | int }}
  metrics:
    {{- with $as.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . | int }}
    {{- end }}
    {{- with $as.requestsPerSecond }}
    {{- if .enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ .metricName }}
        target:
          type: AverageValue
          averageValue: {{ .targetAverageValue | quote }}
    {{- end }}
    {{- end }}
  {{- with $as.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
