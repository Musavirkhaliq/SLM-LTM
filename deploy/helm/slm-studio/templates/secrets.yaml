{{- /*
  Runtime secret. Exactly one source is rendered (see values.yaml `secrets`):
  existingSecret -> nothing; externalSecret.enabled -> ExternalSecret; create -> plain Secret (dev only).
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- if .Values.secrets.externalSecret.enabled }}
apiVersion: {{ .Values.secrets.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "slm.secretName" . }}
  labels:
    {{- include "slm.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    {{- toYaml .Values.secrets.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "slm.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range $key, $ref := .Values.secrets.externalSecret.data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ref.key }}
        {{- with $ref.property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
{{- else if .Values.secrets.create }}
{{- $data := deepCopy .Values.secrets.values }}
{{- if .Values.postgresql.bundled.enabled }}
{{- if not (hasKey $data "SLM_DATABASE_URL") }}
{{- $_ := set $data "SLM_DATABASE_URL" (printf "postgresql://slm_app:%s@%s-postgresql:5432/slm" (required "postgresql.bundled.auth.appPassword is required" .Values.postgresql.bundled.auth.appPassword) (include "slm.fullname" .)) }}
{{- end }}
{{- end }}
{{- if .Values.redis.bundled.enabled }}
{{- if not (hasKey $data "SLM_REDIS_URL") }}
{{- $_ := set $data "SLM_REDIS_URL" (printf "redis://:%s@%s-redis:6379/0" (required "redis.bundled.password is required" .Values.redis.bundled.password) (include "slm.fullname" .)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "slm.secretName" . }}
  labels:
    {{- include "slm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
{{- end }}
