# Sample vLLM model server: Phi-4-mini on one GPU, prefix caching + speculative decoding (n-gram) enabled.
# Equivalent to what the Helm chart renders for vllm.models.phi-4-mini, using a Deployment for brevity.
#
# Notes
#  - RWO cache PVC + Deployment => strategy Recreate (a RollingUpdate would deadlock on the volume and on the single GPU).
#    The Helm chart uses a StatefulSet with a PVC per replica instead, which scales safely.
#  - HF token (private/gated models): kubectl -n slm-studio create secret generic hf-token --from-literal=token=hf_...
#  - DGX Spark (arm64): use image nvcr.io/nvidia/vllm:<tag> and add nodeSelector kubernetes.io/arch: arm64.
#  - deployments.internal_url for the gateway: http://vllm-phi-4-mini.slm-studio.svc.cluster.local:8000
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-phi-4-mini-cache
  namespace: slm-studio
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: phi-4-mini
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-phi-4-mini
  namespace: slm-studio
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: phi-4-mini
    app.kubernetes.io/part-of: slm-studio
    slm-studio.io/tier: inference
    slm-studio.io/scrape: vllm
    slm-studio.io/deployment: phi-4-mini
spec:
  selector:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: phi-4-mini
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-phi-4-mini
  namespace: slm-studio
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: phi-4-mini
    app.kubernetes.io/part-of: slm-studio
    slm-studio.io/tier: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: phi-4-mini
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: phi-4-mini
        app.kubernetes.io/part-of: slm-studio
        slm-studio.io/tier: inference
        slm-studio.io/deployment: phi-4-mini
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.10.2
          command: ["vllm", "serve"]
          args:
            - microsoft/Phi-4-mini-instruct
            - --served-model-name=phi-4-mini
            - --host=0.0.0.0
            - --port=8000
            - --max-model-len=16384
            - --gpu-memory-utilization=0.90
            - --max-num-seqs=128
            - --max-num-batched-tokens=8192
            - --enable-prefix-caching
            - '--speculative-config={"method":"ngram","num_speculative_tokens":5,"prompt_lookup_max":4}'
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: HOME, value: /tmp }
            - { name: HF_HOME, value: /cache/hf }
            - { name: VLLM_CACHE_ROOT, value: /cache/vllm }
            - { name: TRITON_CACHE_DIR, value: /cache/triton }
            - { name: TORCHINDUCTOR_CACHE_DIR, value: /cache/inductor }
            - { name: VLLM_NO_USAGE_STATS, value: "1" }
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          resources:
            requests: { cpu: "4", memory: 24Gi, nvidia.com/gpu: 1 }
            limits: { memory: 48Gi, nvidia.com/gpu: 1 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - { name: cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: vllm-phi-4-mini-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-phi-4-mini
  namespace: slm-studio
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: phi-4-mini
