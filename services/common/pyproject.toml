[project]
name = "slm-common"
version = "0.1.0"
description = "Shared library for SLM Studio services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.9",
  "structlog>=24.4",
  "redis>=5.0",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_common"]
