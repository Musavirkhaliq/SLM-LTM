[project]
name = "slm-gateway"
version = "0.1.0"
description = "SLM Studio OpenAI-compatible inference gateway and control-plane reverse proxy"
requires-python = ">=3.11"
dependencies = [
  "slm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "redis>=5.0",
  "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_gateway"]
