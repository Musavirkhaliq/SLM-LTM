[project]
name = "slm-monitoring"
version = "0.1.0"
description = "SLM Studio monitoring service"
requires-python = ">=3.11"
dependencies = [
  "slm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_monitoring"]
