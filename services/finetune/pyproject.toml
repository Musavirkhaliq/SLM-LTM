[project]
name = "slm-finetune"
version = "0.1.0"
description = "SLM Studio finetune service"
requires-python = ">=3.11"
dependencies = [
  "slm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_finetune"]
