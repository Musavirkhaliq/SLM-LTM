[project]
name = "slm-auth"
version = "0.1.0"
description = "SLM Studio identity, tenancy and API-key service"
requires-python = ">=3.11"
dependencies = [
  "slm-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic[email]>=2.8",
  "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slm_auth"]
