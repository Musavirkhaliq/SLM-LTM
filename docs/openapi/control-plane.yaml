openapi: 3.1.0
info:
  title: SLM Studio Control Plane API
  version: 0.1.0
  summary: REST API under /api/v1/* behind the SLM Studio gateway (CONTRACT.md section 5).
  description: |
    The gateway reverse-proxies `/api/v1/*` to the owning service by path prefix. Authentication is a JWT
    bearer (15 minute access token) issued by the auth service; the active organization is the `org` claim.

    **Conventions** (CONTRACT.md section 2)

    - Errors are RFC 7807 `application/problem+json`.
    - Lists are cursor-paginated: `?limit=50&cursor=<opaque>` returns `{"items": [...], "next_cursor": "..." | null}`.
    - Every mutation writes `audit_logs`.
    - Every response carries `X-Request-ID`.
    - IDs are UUIDs.
    - Minimum role per operation is given in `x-required-role` (`viewer` < `developer` < `ml_engineer` < `org_admin` < `platform_admin`).

    **Status.** Auth and registry operations are implemented. Deployment, fine-tuning, RAG, evaluation, monitoring,
    cost and audit operations are served by typed stubs: the shapes below are the target contract, and not
    every operation has business logic behind it yet. Operations marked `x-proposed: true` are not in CONTRACT.md
    section 5 but are required by the web UI; they should be added to the contract. Request/response bodies are
    **Proposed** where CONTRACT.md only lists the path.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local development (gateway)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organization
  - name: Projects
  - name: API keys
  - name: Registry
  - name: Deployments
  - name: Fine-tuning
  - name: RAG
  - name: Evaluation
  - name: Monitoring
  - name: Cost
  - name: Audit
paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user (and optionally create an organization)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      description: Reusing an already-rotated refresh token revokes the whole token family.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh-token family
      responses:
        '204':
          description: Logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [Auth]
      operationId: oauthStart
      summary: Begin OAuth sign-in
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
      responses:
        '302':
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      operationId: oauthCallback
      summary: OAuth redirect target
      security: []
      parameters:
        - $ref: '#/components/parameters/OAuthProvider'
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tokens (or a redirect to the web app carrying a one-time code, implementation choice).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '302':
          description: Redirect to the web app.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Current user and memberships
      x-required-role: viewer
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/orgs/switch:
    post:
      tags: [Organization]
      operationId: switchOrg
      summary: Switch the active organization
      description: Returns new tokens whose `org` and `role` claims reflect the target membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [org_id]
              properties:
                org_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: New tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/orgs/members:
    get:
      tags: [Organization]
      operationId: listMembers
      summary: List organization members
      x-required-role: org_admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Members.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Organization]
      operationId: addMember
      summary: Add or invite a member
      x-required-role: org_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/orgs/members/{user_id}:
    patch:
      tags: [Organization]
      operationId: updateMember
      summary: Change a member's role
      x-required-role: org_admin
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: '#/components/schemas/OrgRole'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Organization]
      operationId: removeMember
      summary: Remove a member
      description: Fails with 409 if it would remove the last `org_admin`.
      x-required-role: org_admin
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      x-required-role: developer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects/{id}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      x-required-role: developer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Soft-delete a project
      x-required-role: org_admin
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys:
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List API keys (never returns secrets)
      x-required-role: developer
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        The plaintext key is returned once. `scope=organization` requires `org_admin`;
        `scope=project` (with `project_id`) requires `developer`.
      x-required-role: developer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Created; contains the plaintext key once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/api-keys/{id}/rotate:
    post:
      tags: [API keys]
      operationId: rotateApiKey
      summary: Rotate an API key
      description: Creates a new key linked by `rotated_from`; the old key stays valid until `grace_until`.
      x-required-role: developer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_period_seconds:
                  type: integer
                  minimum: 0
                  maximum: 2592000
                  default: 86400
      responses:
        '201':
          description: New key (plaintext shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys/{id}:
    delete:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Sets `revoked_at`; effective at the gateway within the 60 s cache TTL (push invalidation is a design goal).
      x-required-role: developer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Revoked.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys/{id}/usage:
    get:
      tags: [API keys]
      operationId: getApiKeyUsage
      summary: Usage for one key
      x-required-role: developer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Aggregated usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyUsage'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/models:
    get:
      tags: [Registry]
      operationId: listModels
      summary: List models (own org plus global catalogue)
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: family
          in: query
          schema:
            type: string
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPage'
    post:
      tags: [Registry]
      operationId: registerModel
      summary: Register a model
      x-required-role: ml_engineer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/models/{id}:
    get:
      tags: [Registry]
      operationId: getModel
      summary: Get a model
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Registry]
      operationId: updateModel
      summary: Update model metadata
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                license:
                  type: string
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/models/{id}/archive:
    post:
      tags: [Registry]
      operationId: archiveModel
      summary: Archive a model
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/models/{id}/versions:
    get:
      tags: [Registry]
      operationId: listModelVersions
      summary: List versions of a model
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersionPage'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Registry]
      operationId: createModelVersion
      summary: Register a new version
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelVersionCreate'
      responses:
        '201':
          description: Registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/models/{id}/versions/{v}/rollback:
    post:
      tags: [Registry]
      operationId: rollbackModelVersion
      summary: Re-activate an older version
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/VersionNumber'
      responses:
        '200':
          description: Version re-activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/models/{id}/versions/{v}:
    patch:
      tags: [Registry]
      operationId: updateModelVersion
      summary: Update benchmark scores or status
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/VersionNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                benchmark_scores:
                  type: object
                  additionalProperties:
                    type: number
                status:
                  $ref: '#/components/schemas/VersionStatus'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelVersion'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/deployments:
    get:
      tags: [Deployments]
      operationId: listDeployments
      summary: List deployments
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DeployStatus'
      responses:
        '200':
          description: Deployments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentPage'
    post:
      tags: [Deployments]
      operationId: createDeployment
      summary: Create a deployment
      x-required-role: ml_engineer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreate'
      responses:
        '202':
          description: Accepted; status starts at `pending`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/deployments/{id}:
    get:
      tags: [Deployments]
      operationId: getDeployment
      summary: Get a deployment
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Deployments]
      operationId: updateDeployment
      summary: Update replicas range or vLLM arguments
      description: Changing `vllm_args` triggers a rolling restart.
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Deployments]
      operationId: deleteDeployment
      summary: Delete a deployment
      description: Fails with 409 while the deployment has non-zero route weight.
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/deployments/{id}/start:
    post:
      tags: [Deployments]
      operationId: startDeployment
      summary: Start a stopped deployment
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/deployments/{id}/stop:
    post:
      tags: [Deployments]
      operationId: stopDeployment
      summary: Stop a deployment (releases GPUs)
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/deployments/{id}/scale:
    post:
      tags: [Deployments]
      operationId: scaleDeployment
      summary: Change replica bounds
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [replicas_min, replicas_max]
              properties:
                replicas_min:
                  type: integer
                  minimum: 0
                replicas_max:
                  type: integer
                  minimum: 1
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/deployments/{id}/rollback:
    post:
      tags: [Deployments]
      operationId: rollbackDeployment
      summary: Roll back to `previous_deployment_id`
      description: Shifts route weight back to the previous deployment; the failed one is stopped.
      x-required-role: ml_engineer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '202':
          description: Accepted; status becomes `rolling_back`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/endpoints:
    get:
      tags: [Deployments]
      operationId: listEndpoints
      summary: List endpoint aliases with their routes
      x-required-role: viewer
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Endpoints.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointPage'
