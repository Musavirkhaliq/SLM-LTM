  /api/v1/monitoring/stream:
    get:
      tags: [Monitoring]
      operationId: monitoringStream
      summary: WebSocket stream of real-time metrics
      description: |
        Upgrade to WebSocket (`Connection: Upgrade`, `Upgrade: websocket`). Browsers cannot set an `Authorization`
        header on a WebSocket; the access token is sent as the first client message
        `{"type":"auth","token":"<jwt>"}` (**Proposed**; alternative is a short-lived `?ticket=` query parameter).
        Server messages are JSON objects of schema `MonitoringStreamMessage`, one per second per subscribed deployment.
      x-required-role: viewer
      x-websocket: true
      parameters:
        - name: deployment_id
          in: query
          required: false
          description: Subscribe to one deployment; omit for org overview.
