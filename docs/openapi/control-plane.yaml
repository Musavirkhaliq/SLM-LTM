              by_resource:
                type: object
                description: usd per resource (`gpu_hour`, `input_token_1k`, ...).
                additionalProperties:
                  type: number
              quantity_by_resource:
                type: object
                additionalProperties:
                  type: number
    AuditLog:
      type: object
      required: [id, actor_type, action, resource, created_at]
      properties:
        id:
          type: integer
          format: int64
        org_id:
          type: [string, 'null']
          format: uuid
        actor_id:
          type: [string, 'null']
          format: uuid
        actor_type:
          type: string
          enum: [user, api_key, system]
        action:
          type: string
          examples: [api_key.create, deployment.scale]
        resource:
          type: string
        resource_id:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
        detail:
          type: object
          additionalProperties: true
        prev_hash:
          type: [string, 'null']
          description: Hex.
        row_hash:
          type: [string, 'null']
          description: Hex.
        created_at:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
