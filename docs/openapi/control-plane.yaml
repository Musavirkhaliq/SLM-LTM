components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `/api/v1/auth/login` (15 minutes). Claims `sub`, `org`, `role`, `exp`, `iat`, `jti`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: v
      in: path
      required: true
      description: Integer version number (`model_versions.version`).
      schema:
        type: integer
        minimum: 1
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum: [azure_ad, google, github]
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous `next_cursor`.
      schema:
        type: string
    From:
      name: from
      in: query
      description: Inclusive start (ISO 8601 date or date-time).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive end (ISO 8601 date or date-time).
      schema:
        type: string
        format: date-time
  headers:
    XRequestID:
      description: Request id.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing, expired or invalid token / credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but the role is insufficient, or the resource belongs to another organization.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist in the caller's organization (cross-tenant ids also return 404).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict (duplicate slug/alias, illegal state transition).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: Request body or parameters failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Upload exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QuotaExceeded:
      description: A quota (for example `max_gpu_hours` or monthly budget) would be exceeded.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Too many attempts.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 7807 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Problem type URI, `https://slm-studio.dev/problems/<code>` in the implemented services.
          examples: ['https://slm-studio.dev/problems/not_found']
        code:
          type: string
          description: Stable machine-readable code (extension member), for example `validation_error`, `not_found`, `conflict`, `unauthorized`.
        param:
          type: string
          description: Offending request parameter when applicable (extension member).
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        errors:
          type: array
          description: Field-level validation errors (422).
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
      additionalProperties: true
    NextCursor:
      type: [string, 'null']
      description: Opaque cursor for the next page, null on the last page.
    OrgRole:
      type: string
      enum: [org_admin, ml_engineer, developer, viewer]
    VersionStatus:
      type: string
      enum: [registered, active, archived]
    DeployStatus:
      type: string
      enum: [pending, provisioning, running, stopped, failed, rolling_back]
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds (900).
        token_type:
          type: string
          enum: [bearer]
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        display_name:
          type: string
        org_name:
          type: string
          description: If present, a new organization is created and the user becomes its `org_admin`.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        mfa_code:
          type: string
          description: TOTP code when MFA is enabled (Proposed).
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    Membership:
      type: object
      required: [org_id, org_name, org_slug, role]
      properties:
        org_id:
          type: string
          format: uuid
        org_name:
          type: string
        org_slug:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
    Me:
      type: object
      required: [id, email, display_name, is_platform_admin, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        is_platform_admin:
          type: boolean
        active_org_id:
          type: [string, 'null']
          format: uuid
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Member:
      type: object
      required: [user_id, email, display_name, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
        created_at:
          type: string
          format: date-time
    AddMemberRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/OrgRole'
        display_name:
          type: string
    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    Project:
      type: object
      required: [id, org_id, slug, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: [string, 'null']
        created_by:
          type: [string, 'null']
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        name:
          type: string
        description:
          type: string
    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
    ProjectPage:
      type: object
      required: [items, next_cursor]
